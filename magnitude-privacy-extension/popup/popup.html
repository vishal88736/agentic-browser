<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body data-theme="dark">
  <header class="app-header">
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z" fill="currentColor" opacity="0.9"/><path d="M9 12l2 2 4-4" stroke="#0d1117" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="name">Privacy Shield<small>Local-first browser agent</small></div>
    </div>
    <div class="spacer"></div>
    <button id="themeToggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.8"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <button id="openOptions" class="icon-btn" title="Settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </header>

  <!-- Protection status -->
  <section class="card status-hero">
    <div class="hero-icon"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5l8-3z" fill="currentColor"/><path d="M9 12l2 2 4-4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div style="flex:1">
      <div style="display:flex; align-items:center; gap:8px">
        <h2 class="hero-title" id="statusTitle">Protected</h2>
        <span class="pill pill-protected" id="statusPill"><span class="dot"></span><span id="statusPillText">Protected</span></span>
      </div>
      <p class="hero-detail" id="statusDetail">Local privacy layer active.</p>
    </div>
  </section>

  <!-- Pipeline -->
  <section class="card">
    <p class="card-title">Privacy pipeline</p>
    <div class="stepper" id="stepper"></div>
  </section>

  <!-- Detection summary -->
  <section class="card">
    <p class="card-title">This session</p>
    <div class="stat-grid" id="statGrid"></div>
  </section>

  <!-- Agent controls -->
  <section class="card">
    <p class="card-title">Agent</p>
    <label class="field-label" for="instruction">Task instruction</label>
    <textarea id="instruction" rows="2" placeholder="e.g. Fill in the demoauth form"></textarea>
    <div class="btn-row" style="margin-top:10px">
      <button id="run" class="btn btn-primary">Run task</button>
      <button id="stop" class="btn" disabled>Stop</button>
      <button id="rescan" class="btn">Re-run scan</button>
    </div>
    <div class="btn-row" style="margin-top:8px">
      <button id="openDemo" class="btn btn-ghost btn-sm">Open demo</button>
      <button id="clearActivity" class="btn btn-ghost btn-sm">Clear activity</button>
    </div>
  </section>

  <!-- Vault -->
  <section class="card" id="vaultCard">
    <p class="card-title">Credential vault</p>
    <div id="vaultLocked">
      <label class="field-label" for="popup_password">Master password</label>
      <div class="btn-row">
        <input id="popup_password" type="password" placeholder="Unlock local vault" style="flex:1" />
        <button id="unlockVaultBtn" class="btn">Unlock</button>
      </div>
    </div>
    <div id="vaultUnlocked" class="hidden" style="color:var(--ok); font-size:12px">✓ Vault unlocked — credentials resolved locally only.</div>
  </section>

  <!-- Recent activity -->
  <section class="card">
    <p class="card-title">Recent activity</p>
    <ul class="activity" id="activity"></ul>
  </section>

  <script type="module" src="popup.js"></script>
</body>
</html>
